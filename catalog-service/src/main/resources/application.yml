server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres-catalog:5432/catalog_db
    username: admin
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog-master.yml
    enabled: true

# ??????????? ????????? ??? Feign ???????? catalog-service
feign:
  client:
    config:
      # ???? catalog-service ????? ???????? ?????? ???????
      pricing-service:
        connectTimeout: 3000
        readTimeout: 5000

# ????????? ??? ???????????
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    db:
      enabled: true
    diskspace:
      enabled: true