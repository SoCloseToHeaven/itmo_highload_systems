server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://postgres-order:5432/order_db
    username: admin
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog-master.yml
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka/
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      catalog-service:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: full
      pricing-service:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: full

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

resilience4j:
  circuitbreaker:
    instances:
      catalogService:
        slidingWindowSize: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 30000
      pricingService:
        slidingWindowSize: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 30000
  retry:
    instances:
      catalogService:
        maxAttempts: 3
        waitDuration: 1000

