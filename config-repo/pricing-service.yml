server:
  port: 8082

spring:
  r2dbc:
    url: r2dbc:postgresql://postgres-pricing:5432/pricing_db
    username: admin
    password: root
  main:
    web-application-type: reactive

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

resilience4j:
  circuitbreaker:
    instances:
      productService:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 15000

feign:
  client:
    config:
      catalog-service:
        connectTimeout: 2000
        readTimeout: 3000

