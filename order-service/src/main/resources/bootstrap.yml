spring:
  application:
    name: order-service
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: true
      retry:
        initial-interval: 2000
        max-attempts: 60
        max-interval: 10000
        multiplier: 1.1

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    # Не блокировать старт приложения, если Eureka недоступна
    should-on-demand-update-status-change: true
    should-unregister-on-shutdown: true
    # Интервалы для быстрого подключения
    initial-instance-info-replication-interval-seconds: 3
    instance-info-replication-interval-seconds: 3
    registry-fetch-interval-seconds: 3
    # Retry для подключения к Eureka
    eureka-service-url-poll-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Быстрая регистрация и обновление
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 10

