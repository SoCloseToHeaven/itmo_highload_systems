services:
  # Базы данных
  postgres-db:
    image: postgres:15.5
    container_name: postgres-db
    environment:
      POSTGRES_DB: tobacco_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    networks:
      - tobacco-net

  tobacco_shop:
    build: ./
    depends_on:
      - postgres-db
    container_name: tobacco_shop
    ports:
      - "8080:8080"
    environment:
        - "SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/tobacco_db"
        - "SPRING_DATASOURCE_USERNAME=admin"
        - "SPRING_DATASOURCE_PASSWORD=root"
    networks:
      - tobacco-net

networks:
  tobacco-net:
    driver: bridge